<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>interop-password on a plain page</title>
		<link rel="stylesheet" href="dist/interop.css" />
		<script type="module" src="dist/password.js"></script>
	</head>
	<body>
		<h1>interop-password on a plain page</h1>
		<form id="sign-in">
			<div interop-field>
				<label for="password">Password</label>
				<interop-password>
					<input
						interop-input
						id="password"
						type="password"
						name="password"
						autocomplete="current-password"
					/>
					<button
						interop-button
						type="button"
						commandfor="password"
						command="--toggle-password"
						aria-pressed="false"
					>
						Show password
					</button>
				</interop-password>
			</div>
			<button interop-button type="submit">Sign in</button>
			<button interop-button type="reset">Reset</button>
		</form>
		<script>
			// The page stays put, so the check can read the state after a submit.
			document
				.querySelector("#sign-in")
				.addEventListener("submit", (event) => event.preventDefault());
		</script>
	</body>
</html>
