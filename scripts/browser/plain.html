<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Spike: interop/tabs on a plain page</title>
		<link rel="stylesheet" href="dist/interop.css" />
		<script type="module" src="dist/tabs.js"></script>
		<style>
			body {
				font-family: system-ui, sans-serif;
				max-inline-size: 48rem;
				margin: 2rem auto;
				padding-inline: 1rem;
			}
		</style>
	</head>
	<body>
		<h1>interop/tabs on a plain page</h1>

		<h2>Parsed markup</h2>
		<interop-tabs id="parsed">
			<div role="tablist" aria-label="Project sections">
				<button
					type="button"
					role="tab"
					aria-controls="overview"
					aria-selected="true"
				>
					Overview
				</button>
				<button type="button" role="tab" aria-controls="activity">
					Activity
				</button>
				<button type="button" role="tab" aria-controls="files">Files</button>
			</div>
			<section role="tabpanel" id="overview">
				<p>Three tasks are due.</p>
			</section>
			<section role="tabpanel" id="activity" hidden="until-found">
				<p>Two people commented.</p>
			</section>
			<section role="tabpanel" id="files" hidden="until-found">
				<p>Twelve files are shared.</p>
			</section>
		</interop-tabs>

		<h2>Inserted with innerHTML</h2>
		<div id="later"></div>

		<h2>In the page before its children</h2>
		<div id="built"></div>

		<script type="module">
			document.querySelector("#later").innerHTML = `
				<interop-tabs id="inserted" itx-variant="segmented">
					<div role="tablist" aria-label="Report">
						<button type="button" role="tab" aria-controls="daily">Daily</button>
						<button type="button" role="tab" aria-controls="weekly">Weekly</button>
					</div>
					<section role="tabpanel" id="daily"><p>Daily report.</p></section>
					<section role="tabpanel" id="weekly"><p>Weekly report.</p></section>
				</interop-tabs>`;

			// The element is in the page before it has children, as when a parser or a framework
			// inserts the host first.
			const tabs = document.createElement("interop-tabs");
			tabs.id = "built-tabs";
			document.querySelector("#built").append(tabs);
			const list = document.createElement("div");
			list.setAttribute("role", "tablist");
			list.setAttribute("aria-label", "Built");
			tabs.append(list);
			for (const name of ["one", "two"]) {
				const tab = document.createElement("button");
				tab.type = "button";
				tab.setAttribute("role", "tab");
				tab.setAttribute("aria-controls", `built-${name}`);
				tab.textContent = name;
				list.append(tab);
				const panel = document.createElement("section");
				panel.setAttribute("role", "tabpanel");
				panel.id = `built-${name}`;
				panel.textContent = `Panel ${name}`;
				tabs.append(panel);
			}
		</script>
	</body>
</html>
