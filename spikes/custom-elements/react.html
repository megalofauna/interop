<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Spike: interop/tabs in React</title>
		<link rel="stylesheet" href="dist/interop.css" />
		<style>
			body {
				font-family: system-ui, sans-serif;
				max-inline-size: 48rem;
				margin: 2rem auto;
				padding-inline: 1rem;
			}
		</style>
		<!-- React 19 from esm.sh, so the spike needs no install. -->
		<script type="importmap">
			{
				"imports": {
					"react": "https://esm.sh/react@19",
					"react-dom/client": "https://esm.sh/react-dom@19/client"
				}
			}
		</script>
	</head>
	<body>
		<h1>interop/tabs in React</h1>
		<div id="app"></div>
		<script type="module">
			import "./dist/tabs.js";
			import { createElement as h, useEffect, useRef, useState } from "react";
			import { createRoot } from "react-dom/client";

			function Logs() {
				const [logs, setLogs] = useState([
					{ id: "log-1", name: "Log 1" },
					{ id: "log-2", name: "Log 2" },
				]);
				const [last, setLast] = useState("");
				const tabs = useRef(null);
				// The change event is wired with a ref. Whether React 19's `on…` props reach a hyphenated
				// event name is a spike question.
				useEffect(() => {
					const changed = (event) => setLast(event.detail.panel?.id ?? "");
					tabs.current.addEventListener("interop-tabs-change", changed);
					return () =>
						tabs.current?.removeEventListener("interop-tabs-change", changed);
				}, []);
				const add = () =>
					setLogs((all) => [
						...all,
						{ id: `log-${all.length + 1}`, name: `Log ${all.length + 1}` },
					]);
				const removeSelected = () => {
					const id = tabs.current
						.querySelector('[role="tab"][aria-selected="true"]')
						?.getAttribute("aria-controls");
					setLogs((all) => all.filter((log) => log.id !== id));
				};
				return h(
					"div",
					null,
					h(
						"interop-tablist",
						{ ref: tabs, "itx-activation": "manual", "aria-label": "Logs" },
						logs.map((log) =>
							h(
								"button",
								{
									key: log.id,
									type: "button",
									role: "tab",
									"aria-controls": log.id,
								},
								log.name,
							),
						),
					),
					logs.map((log) =>
						h(
							"section",
							{ key: log.id, role: "tabpanel", id: log.id },
							h("p", null, `${log.name} entry.`),
						),
					),
					h("p", null, `Last change: ${last || "none"}`),
					h("button", { type: "button", id: "add", onClick: add }, "Add a log"),
					" ",
					h(
						"button",
						{ type: "button", id: "remove", onClick: removeSelected },
						"Remove the selected log",
					),
				);
			}

			createRoot(document.querySelector("#app")).render(h(Logs));
		</script>
	</body>
</html>
