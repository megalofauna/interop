<nav
	#panel
	id="site-nav"
	[attr.popover]="drawer() ? 'auto' : null"
	class="nav__panel"
>
	<!-- Rendered in both modes and taken out of flow, so crossing the breakpoint
	     neither destroys DOM nor changes the panel's content height — the group
	     list does not jump. CSS alone hides it once the nav is permanent, where
	     it is also no longer focusable. -->
	<button
		type="button"
		interop-button="icon"
		itx-radius="lg"
		class="nav__close"
		command="hide-popover"
		commandfor="site-nav"
		aria-label="Close navigation"
	>
		<interop-icon name="tabler-layout-sidebar-right-expand" [size]="24" />
	</button>
	@for (group of groups; track group.label) {
		<div class="nav__group" [class.nav__group--disabled]="group.disabled">
			<h3 class="nav__group-label">{{ group.label }}</h3>
			@if (!group.disabled && group.items.length) {
				<ul class="nav__list">
					@for (item of group.items; track item.label) {
						<li>
							@if (item.route) {
								<a
									class="nav__link"
									[routerLink]="item.route"
									routerLinkActive="nav__link--active"
									[routerLinkActiveOptions]="{ exact: !!item.exact }"
									(click)="closeDrawer()"
								>
									{{ item.label }}
									@if (item.internal) {
										<span interop-chip-badge itx-size="sm" class="nav__tag"
											>internal</span
										>
									}
								</a>
							} @else {
								<span class="nav__link nav__link--placeholder">
									{{ item.label }}
								</span>
							}
						</li>
					}
				</ul>
			}
		</div>
	}
</nav>
