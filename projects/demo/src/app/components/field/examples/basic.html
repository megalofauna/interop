<div interop-field>
	<label for="email">Email address</label>
	<p interop-hint id="email-hint">We send the receipt here</p>
	<p interop-error hidden></p>
	<input
		interop-input
		id="email"
		type="email"
		name="email"
		autocomplete="email"
		spellcheck="false"
		aria-describedby="email-hint"
	/>
</div>
