<form>
	<div interop-field>
		<label for="password">Password</label>
		<interop-password>
			<input
				interop-input
				id="password"
				type="password"
				name="password"
				autocomplete="current-password"
				autocapitalize="off"
				spellcheck="false"
			/>
			<button
				interop-button
				type="button"
				commandfor="password"
				command="--toggle-password"
				aria-pressed="false"
			>
				Show password
			</button>
		</interop-password>
	</div>
</form>
