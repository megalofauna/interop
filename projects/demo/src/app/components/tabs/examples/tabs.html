<interop-tabs>
	<div role="tablist" aria-label="Project sections">
		<button
			type="button"
			role="tab"
			aria-controls="overview"
			aria-selected="true"
		>
			Overview
		</button>
		<button
			type="button"
			role="tab"
			aria-controls="activity"
			aria-selected="false"
			tabindex="-1"
		>
			Activity
		</button>
		<button
			type="button"
			role="tab"
			aria-controls="files"
			aria-selected="false"
			tabindex="-1"
		>
			Files
		</button>
	</div>
	<section role="tabpanel" id="overview">
		<p>Three tasks are due this week.</p>
	</section>
	<section role="tabpanel" id="activity" hidden="until-found">
		<p>Two people commented today.</p>
	</section>
	<section role="tabpanel" id="files" hidden="until-found">
		<p>Twelve files are shared with you.</p>
	</section>
</interop-tabs>
