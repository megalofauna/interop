<div interop-tabs>
	<div role="tablist" aria-label="Month">
		<button
			type="button"
			role="tab"
			aria-controls="m-january"
			aria-selected="true"
		>
			January
		</button>
		<button
			type="button"
			role="tab"
			aria-controls="m-february"
			aria-selected="false"
			tabindex="-1"
		>
			February
		</button>
		<button
			type="button"
			role="tab"
			aria-controls="m-march"
			aria-selected="false"
			tabindex="-1"
		>
			March
		</button>
		<button
			type="button"
			role="tab"
			aria-controls="m-april"
			aria-selected="false"
			tabindex="-1"
		>
			April
		</button>
		<button
			type="button"
			role="tab"
			aria-controls="m-may"
			aria-selected="false"
			tabindex="-1"
		>
			May
		</button>
		<button
			type="button"
			role="tab"
			aria-controls="m-june"
			aria-selected="false"
			tabindex="-1"
		>
			June
		</button>
		<button
			type="button"
			role="tab"
			aria-controls="m-july"
			aria-selected="false"
			tabindex="-1"
		>
			July
		</button>
		<button
			type="button"
			role="tab"
			aria-controls="m-august"
			aria-selected="false"
			tabindex="-1"
		>
			August
		</button>
	</div>
	<section role="tabpanel" id="m-january"><p>January.</p></section>
	<section role="tabpanel" id="m-february" hidden="until-found">
		<p>February.</p>
	</section>
	<section role="tabpanel" id="m-march" hidden="until-found">
		<p>March.</p>
	</section>
	<section role="tabpanel" id="m-april" hidden="until-found">
		<p>April.</p>
	</section>
	<section role="tabpanel" id="m-may" hidden="until-found"><p>May.</p></section>
	<section role="tabpanel" id="m-june" hidden="until-found">
		<p>June.</p>
	</section>
	<section role="tabpanel" id="m-july" hidden="until-found">
		<p>July.</p>
	</section>
	<section role="tabpanel" id="m-august" hidden="until-found">
		<p>August.</p>
	</section>
</div>
