<fieldset interop-radio-group="segmented">
	<legend>Raised (default)</legend>
	<label><input type="radio" name="look-a" value="day" /> Day</label>
	<label><input type="radio" name="look-a" value="week" checked /> Week</label>
	<label><input type="radio" name="look-a" value="month" /> Month</label>
</fieldset>
<fieldset interop-radio-group="segmented" class="inverted">
	<legend>Inverted</legend>
	<label><input type="radio" name="look-b" value="day" /> Day</label>
	<label><input type="radio" name="look-b" value="week" checked /> Week</label>
	<label><input type="radio" name="look-b" value="month" /> Month</label>
</fieldset>
