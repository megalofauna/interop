<div interop-callout role="note">
	<div>
		<small>
			<svg interop-icon name="tabler-note"></svg>
			Note</small
		>
		<p>Runs are kept for 90 days.</p>
	</div>
</div>
<div interop-callout role="note" itx-color="info">
	<div>
		<small>
			<svg interop-icon name="tabler-info-circle"></svg>
			Info</small
		>
		<p>Exports include every run in the project.</p>
	</div>
</div>
<div interop-callout role="note" itx-color="success">
	<div>
		<small>
			<svg interop-icon name="tabler-circle-check"></svg>
			Success</small
		>
		<p>This project is backed up nightly.</p>
	</div>
</div>
<div interop-callout role="note" itx-color="warning">
	<div>
		<small>
			<svg interop-icon name="tabler-alert-triangle"></svg>
			Warning</small
		>
		<p>Renaming a project breaks links to it.</p>
	</div>
</div>
<div interop-callout role="note" itx-color="danger">
	<div>
		<small>
			<svg interop-icon name="tabler-alert-circle"></svg>
			Danger</small
		>
		<p>Deleting a project deletes its runs.</p>
	</div>
</div>
