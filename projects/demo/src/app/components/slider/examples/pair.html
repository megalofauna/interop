<fieldset class="pair">
	<legend>Price, in dollars</legend>
	<div interop-field>
		<label for="price-min">Minimum</label>
		<input
			interop-input
			id="price-min"
			name="price-min"
			inputmode="numeric"
			size="6"
		/>
	</div>
	<div interop-field>
		<label for="price-max">Maximum</label>
		<input
			interop-input
			id="price-max"
			name="price-max"
			inputmode="numeric"
			size="6"
		/>
	</div>
</fieldset>
