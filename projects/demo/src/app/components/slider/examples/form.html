<form id="display" itx-flow>
	<div interop-field>
		<label for="brightness">Brightness</label>
		<input
			type="range"
			interop-slider
			id="brightness"
			name="brightness"
			min="0"
			max="100"
			value="70"
		/>
	</div>
	<p>
		<button interop-button type="submit">Save</button>
		<button interop-button type="reset">Reset</button>
	</p>
</form>
