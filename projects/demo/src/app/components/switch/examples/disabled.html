<label interop-switch
	><input type="checkbox" role="switch" disabled /> Off and disabled</label
>
<label interop-switch
	><input type="checkbox" role="switch" checked disabled /> On and
	disabled</label
>

<fieldset interop-checkbox-group disabled>
	<legend>Sync (a disabled fieldset)</legend>
	<label interop-switch
		><input
			type="checkbox"
			role="switch"
			name="sync"
			value="contacts"
			checked
		/>
		Contacts</label
	>
	<label interop-switch
		><input type="checkbox" role="switch" name="sync" value="calendar" />
		Calendar</label
	>
</fieldset>
