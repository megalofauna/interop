<h1>Icon</h1>

<h2>Registered icons</h2>
<p>
	@for (name of names; track name) {
		<svg interop-icon [name]="name"></svg>
	}
</p>

<h2>Sized by the text around it</h2>
<p class="column">
	<small>Small text <svg interop-icon name="tabler-check"></svg></small>
	<span>Body text <svg interop-icon name="tabler-check"></svg></span>
	<span class="large">Large text <svg interop-icon name="tabler-check"></svg></span>
</p>

<h2>Fixed size</h2>
<p class="column">
	<small>Small text <svg interop-icon name="tabler-check" size="24"></svg></small>
	<span class="large">Large text <svg interop-icon name="tabler-check" size="24"></svg></span>
</p>

<h2>Labelled</h2>
<p>
	<svg interop-icon name="tabler-check" size="24" aria-label="Done"></svg>
</p>

<h2>Your own SVG</h2>
<p>
	<svg interop-icon viewBox="0 0 24 24" size="24" fill="none" stroke="currentColor"><path d="M12 3l9 18H3z" /></svg>
</p>
