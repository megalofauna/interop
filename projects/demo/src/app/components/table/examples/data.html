<div interop-scroll-area aria-labelledby="cargo-caption">
	<table interop-table>
		<caption id="cargo-caption">
			Cargo manifest
		</caption>
		<thead>
			<tr>
				<th scope="col">Item</th>
				<th scope="col">Category</th>
				<th scope="col">Deck</th>
				<th scope="col" itx-numeric>Mass (kg)</th>
				<th scope="col" itx-numeric>Volume (m³)</th>
				<th scope="col" itx-numeric>Value (credits)</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<th scope="row">Water</th>
				<td>Life support</td>
				<td>C</td>
				<td itx-numeric>12,000</td>
				<td itx-numeric>12.0</td>
				<td itx-numeric>3,600</td>
			</tr>
			<tr>
				<th scope="row">Oxygen canisters</th>
				<td>Life support</td>
				<td>C</td>
				<td itx-numeric>2,450</td>
				<td itx-numeric>8.4</td>
				<td itx-numeric>18,900</td>
			</tr>
			<tr>
				<th scope="row">Hull plating</th>
				<td>Spares</td>
				<td>D</td>
				<td itx-numeric>6,780</td>
				<td itx-numeric>4.1</td>
				<td itx-numeric>54,200</td>
			</tr>
			<tr>
				<th scope="row">Seed vault</th>
				<td>Science</td>
				<td>B</td>
				<td itx-numeric>310</td>
				<td itx-numeric>1.2</td>
				<td itx-numeric>220,000</td>
			</tr>
		</tbody>
	</table>
</div>
