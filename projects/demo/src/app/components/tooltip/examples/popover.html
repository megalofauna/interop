<button interop-button type="button" popovertarget="zoom">Options</button>
<div interop-popover popover id="zoom">
	<button interop-button="icon" type="button" aria-labelledby="tip-zoom-out">
		<svg interop-icon name="tabler-minus"></svg>
	</button>
	<span interop-tooltip="label" id="tip-zoom-out">Zoom out</span>
	<button interop-button="icon" type="button" aria-labelledby="tip-zoom-in">
		<svg interop-icon name="tabler-plus"></svg>
	</button>
	<span interop-tooltip="label" id="tip-zoom-in">Zoom in</span>
</div>
