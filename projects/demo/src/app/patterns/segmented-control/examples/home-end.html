<fieldset interop-radio-group="segmented" id="month">
	<legend>Month</legend>
	<label><input type="radio" name="month" value="jan" /> Jan</label>
	<label><input type="radio" name="month" value="feb" /> Feb</label>
	<label><input type="radio" name="month" value="mar" checked /> Mar</label>
	<label><input type="radio" name="month" value="apr" /> Apr</label>
	<label><input type="radio" name="month" value="may" /> May</label>
	<label><input type="radio" name="month" value="jun" /> Jun</label>
</fieldset>
