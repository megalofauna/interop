<fieldset interop-radio-group="segmented">
	<legend>One segment</legend>
	<label
		><input type="radio" name="dis-one" value="draft" checked /> Draft</label
	>
	<label
		><input type="radio" name="dis-one" value="scheduled" disabled />
		Scheduled</label
	>
	<label
		><input type="radio" name="dis-one" value="published" /> Published</label
	>
</fieldset>
<fieldset interop-radio-group="segmented" disabled>
	<legend>The whole control</legend>
	<label><input type="radio" name="dis-all" value="draft" /> Draft</label>
	<label
		><input type="radio" name="dis-all" value="published" checked />
		Published</label
	>
</fieldset>
