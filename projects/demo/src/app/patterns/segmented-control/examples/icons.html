<fieldset interop-radio-group="segmented icon">
	<legend>Alignment</legend>
	<label>
		<input type="radio" name="align" value="start" checked />
		<svg interop-icon name="tabler-chevron-left"></svg>
		<span itx-visually-hidden>Start</span>
	</label>
	<label>
		<input type="radio" name="align" value="center" />
		<svg interop-icon name="tabler-minus"></svg>
		<span itx-visually-hidden>Center</span>
	</label>
	<label>
		<input type="radio" name="align" value="end" />
		<svg interop-icon name="tabler-chevron-right"></svg>
		<span itx-visually-hidden>End</span>
	</label>
</fieldset>
