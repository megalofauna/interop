<fieldset interop-radio-group="cards">
	<legend>Plan</legend>
	<label>
		<input
			type="radio"
			name="plan"
			value="free"
			aria-labelledby="plan-free"
			aria-describedby="plan-free-details"
		/>
		<strong id="plan-free">Free</strong>
		<span id="plan-free-details">
			<span class="price">$0</span>
			<span class="summary">Three projects, community support.</span>
		</span>
	</label>
	<label>
		<input
			type="radio"
			name="plan"
			value="pro"
			checked
			aria-labelledby="plan-pro"
			aria-describedby="plan-pro-details"
		/>
		<strong id="plan-pro">Pro</strong>
		<span id="plan-pro-details">
			<span class="price">$29 a month</span>
			<span class="summary">Unlimited projects, priority support.</span>
			<span interop-badge itx-color="info">Most popular</span>
		</span>
	</label>
	<label>
		<input
			type="radio"
			name="plan"
			value="team"
			aria-labelledby="plan-team"
			aria-describedby="plan-team-details"
		/>
		<strong id="plan-team">Team</strong>
		<span id="plan-team-details">
			<span class="price">$99 a month</span>
			<span class="summary">Everything in Pro, with roles and audit logs.</span>
		</span>
	</label>
</fieldset>
