# Continuous integration for the Interop workspace.
#
# This exists because everything that guards this repo — the lint checks, the
# specs, the builds — used to run only on a maintainer's machine. That is how
# a red deploy reached main: the build passed locally on Node 25 and the first
# environment to run Node 22 was production.
#
# So the job pins the SAME Node the deploy uses (via .nvmrc, which netlify.toml
# mirrors) and runs `npm ci`, not `npm install`. Reproducing the deploy's
# install is half the point — a lock file that npm 10 refuses is exactly the
# failure this is here to catch.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Use the Node version the deploy uses
        uses: actions/setup-node@v5
        with:
          # Reads .nvmrc, so this can never drift from local or from
          # netlify.toml's NODE_VERSION without someone noticing.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        # `ci`, not `install`: it installs strictly from the lock file and fails
        # when the two disagree, which is precisely the deploy failure that
        # motivated this workflow.
        run: npm ci

      # Prettier, stylelint, and three token guards: no private token read across
      # a component boundary, no CSS-wide keyword as a token value, and no var()
      # read of a token nothing declares. Contrast, target size, radius, forced
      # colors and motion are guarded by specs, in the Test step.
      - name: Lint
        run: npm run lint

      # The specs run in jsdom; the browser checks are the Pages step.
      - name: Test
        run: npm test -- --watch=false

      - name: Test demo
        run: npm run test:demo -- --watch=false

      - name: Build library
        run: npm run build:lib

      - name: Build demo
        run: npm run build:demo

      # Every demo page in Chrome: axe with color contrast, light and dark; no sideways scroll at
      # 320px; a focus ring at every Tab stop, also in forced colors. Known failures, each with its
      # reason, are listed in scripts/cdp/known-failures.json.
      - name: Pages
        run: npm run test:pages
        env:
          CHROME_BIN: /usr/bin/google-chrome
